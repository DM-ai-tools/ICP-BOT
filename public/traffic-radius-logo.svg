<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 100" role="img" aria-label="Traffic Radius">
  <title>Traffic Radius</title>

  <!-- Ascending bar mark. Brand colours, never inverted. -->
  <rect x="0"  y="54" width="18" height="42" fill="#1B1D21"/>
  <rect x="26" y="36" width="18" height="60" fill="#3EBBE3"/>
  <rect x="52" y="16" width="18" height="80" fill="#8DC63F"/>
  <rect x="78" y="28" width="18" height="68" fill="#1B1D21"/>

  <!-- Wordmark. viewBox is sized to fit this at 72px so nothing clips. -->
  <text x="112" y="84"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="72" letter-spacing="-1.5">
    <tspan font-weight="700" fill="#2B3137">Traffic</tspan><tspan dx="18" font-weight="300" fill="#2B3137">Radius</tspan>
  </text>

  <!-- Dot over the i in Radius -->
  <circle cx="566" cy="28" r="7.5" fill="#3EBBE3"/>
</svg>
