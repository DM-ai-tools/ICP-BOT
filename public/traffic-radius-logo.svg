<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" role="img" aria-label="Traffic Radius">
  <title>Traffic Radius</title>

  <!-- Ascending bar mark -->
  <rect x="0"  y="52" width="17" height="40" fill="#1B1D21"/>
  <rect x="25" y="34" width="17" height="58" fill="#3EBBE3"/>
  <rect x="50" y="14" width="17" height="78" fill="#8DC63F"/>
  <rect x="75" y="26" width="17" height="66" fill="#1B1D21"/>

  <!-- Wordmark -->
  <text x="108" y="80"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="72" letter-spacing="-2">
    <tspan font-weight="700" fill="#2B3137">Traffic</tspan><tspan dx="16" font-weight="300" fill="#2B3137">Radius</tspan>
  </text>

  <!-- Dot over the i in Radius -->
  <circle cx="452" cy="26" r="7" fill="#3EBBE3"/>
</svg>
